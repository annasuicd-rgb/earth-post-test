<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EARTH POST 明信片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --grass:#7cb342; --grass-d:#4f8a2b; --grass-dd:#386b1f;
  --cream:#fff8e7; --cream-2:#fbefd2; --cream-line:#efdfb8;
  --wood:#8a5a32; --wood-d:#5e3a1d; --wood-l:#b07a46;
  --seal:#d9473b; --ink:#3d2a17; --ink-2:#7a6248;
  --sky1:#bfe6ff; --sky2:#e9f7ff;
  --gold:#f4c542;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2f4a22;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.stage{
  position:relative;width:min(100%, calc((100vh - 32px) * 16 / 9));aspect-ratio:16/9;
  border-radius:28px;overflow:hidden;container-type:inline-size;
  background:
    radial-gradient(ellipse 60% 35% at 15% 100%, #8fcf5a 0 60%, transparent 61%),
    radial-gradient(ellipse 70% 30% at 70% 102%, #9ad466 0 60%, transparent 61%),
    radial-gradient(ellipse 45% 30% at 40% 78%, #a9d98a 0 55%, transparent 56%),
    radial-gradient(ellipse 50% 28% at 85% 72%, #b4dd95 0 55%, transparent 56%),
    linear-gradient(#bfe6ff 0%, #e4f5ff 45%, #cde9b4 62%, #9fd06f 100%);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
/* painted scene */
.scene{position:absolute;inset:0;width:100%;height:100%}
/* sign */
.sign{position:absolute;left:17.5cqw;top:1.2cqw;width:31cqw;height:10.2cqw}
.sign .rope{position:absolute;top:-1.4cqw;width:.45cqw;height:3.2cqw;border-radius:.3cqw;
  background:repeating-linear-gradient(160deg,#9b7447 0 .35cqw,#7a5530 .35cqw .7cqw)}
.sign .rope.l{left:17%}.sign .rope.r{right:17%}
.plank{position:absolute;left:0;right:0;top:1.4cqw;height:7.6cqw;display:grid;place-items:center;
  border-radius:2.6cqw 2.2cqw 2.8cqw 2.3cqw/2.4cqw 2.6cqw 2.2cqw 2.6cqw;border:.32cqw solid #6b4220;
  background:
    radial-gradient(ellipse 1.6cqw .5cqw at 22% 68%,rgba(90,50,20,.28),transparent 70%),
    radial-gradient(ellipse 1.2cqw .4cqw at 80% 30%,rgba(90,50,20,.22),transparent 70%),
    repeating-linear-gradient(177deg,transparent 0 1.1cqw,rgba(110,62,25,.16) 1.1cqw 1.25cqw,transparent 1.25cqw 1.9cqw,rgba(255,225,180,.12) 1.9cqw 2cqw),
    linear-gradient(#c58d55,#a36a37 55%,#8d5a2c);
  box-shadow:inset 0 .4cqw 0 rgba(255,232,195,.45),inset 0 -.5cqw 0 rgba(80,40,12,.3),0 .55cqw 0 #5a361a,0 1.4cqw 2cqw rgba(60,30,0,.28)}
.plank b{font-family:Fredoka,sans-serif;font-weight:700;font-size:4.5cqw;letter-spacing:.2cqw;color:#fff7e0;line-height:1;
  text-shadow:.16cqw 0 0 #6b4220,-.16cqw 0 0 #6b4220,0 .16cqw 0 #6b4220,0 -.16cqw 0 #6b4220,
    .12cqw .12cqw 0 #6b4220,-.12cqw .12cqw 0 #6b4220,.12cqw -.12cqw 0 #6b4220,-.12cqw -.12cqw 0 #6b4220,0 .45cqw 0 #6b4220}
.sign .env{position:absolute;left:50%;top:-1.1cqw;width:6cqw;transform:translateX(-50%) rotate(-4deg);filter:drop-shadow(0 .3cqw .2cqw rgba(80,40,10,.3))}
.sign .leaf{position:absolute;width:5cqw;filter:drop-shadow(0 .2cqw .15cqw rgba(40,70,20,.3))}
.sign .leaf.l{left:-4.2cqw;top:6.4cqw;width:4.4cqw;transform:rotate(-25deg)}
.sign .leaf.l2{left:-1.6cqw;top:8.4cqw;width:3cqw;transform:rotate(30deg)}
.sign .leaf.r{right:-2cqw;top:.4cqw;transform:rotate(150deg) scaleY(-1)}
.sign .leaf.r2{right:.4cqw;top:6.4cqw;width:3.4cqw;transform:rotate(200deg)}
.sub{position:absolute;left:21cqw;top:10.4cqw;font-weight:700;font-size:1.25cqw;color:var(--grass-dd);background:rgba(255,255,255,.7);padding:.3cqw 1cqw;border-radius:99px}
/* avatar rail */
.rail{position:absolute;left:1.6cqw;top:2cqw;bottom:2cqw;width:12.5cqw;border-radius:6cqw;
  background:linear-gradient(#8fc163,#6fa848);border:.3cqw solid #5d9638;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1cqw;padding:1.4cqw 0;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.av{flex:none;width:7.8cqw;height:7.8cqw;border-radius:50%;border:.5cqw solid var(--cream);background:var(--cream-2);
  display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;transition:transform .15s;
  box-shadow:0 .4cqw 0 rgba(0,0,0,.15);padding:0}
.av:hover{transform:scale(1.04)}
.av.on{border-color:var(--gold);box-shadow:0 0 0 .5cqw #fff3c2,0 0 2cqw #ffe27a}
.av img{width:84%;height:84%;object-fit:contain}
.av .ph{font-weight:900;font-size:1.3cqw;color:var(--ink-2);text-align:center;line-height:1.2}
/* 圖鑑分組（v0.26.0）：生物類型分組＋收集進度；棲地篩選；郵差／只觀察／家養標記 */
.rail .hf{flex:none;width:10.6cqw;font:inherit;font-weight:900;font-size:1.05cqw;color:var(--wood-d);background:var(--cream);border:.2cqw solid var(--cream-line);border-radius:99px;padding:.35cqw .6cqw;cursor:pointer}
.rail .grp{flex:none;width:10.6cqw;display:flex;justify-content:space-between;align-items:baseline;gap:.4cqw;padding:.25cqw .7cqw;margin-top:.4cqw;border-radius:99px;background:var(--wood-d,#6b4220);color:#fff8e7}
.rail .grp b{font-size:1.1cqw}.rail .grp small{font-size:.9cqw;font-weight:900;opacity:.9}
.rail .none{font-size:.95cqw;color:var(--ink-2);text-align:center;padding:0 .6cqw}
.av .bd{position:absolute;right:-.1cqw;bottom:.1cqw;width:2.9cqw;height:2.9cqw;border-radius:50%;background:#fff8e7 center/78% no-repeat;border:.2cqw solid var(--cream-line);box-shadow:0 .15cqw .25cqw rgba(0,0,0,.25)}
.av .bd.c{width:3.4cqw;height:3.4cqw;background-size:90%;background-image:url(art/ui/ic_courier_cap.png);background-color:#dff2d6;border-color:#5f9e34}
.av .bd.c.fly{background-image:url(art/ui/ic_courier_cap_fly.png)}   /* 會飛的郵差：帽子加羽毛 */
.av .bd.o{background-image:url(art/ui/ic_observe.png)}
.rail .grp i{flex:none;width:1.6cqw;height:1.6cqw;background:center/contain no-repeat;align-self:center}
.rail .grp b{flex:1}
.av .ch{position:absolute;left:50%;bottom:-.1cqw;transform:translateX(-50%);font-size:.8cqw;font-weight:900;background:#fff1c9;color:#8a5a12;border-radius:99px;padding:.05cqw .5cqw;white-space:nowrap}
/* hero */
.hero{position:absolute;left:30cqw;top:11cqw;width:28cqw;height:27cqw;display:grid;place-items:end center}
.hero .art{width:25cqw;height:25cqw;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.85),rgba(255,255,255,.35) 60%,transparent 70%)}
.hero .art img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 1.2cqw 1cqw rgba(0,0,0,.25))}
.hero .art .ph{width:19cqw;height:19cqw;border-radius:50%;border:.4cqw dashed var(--wood-l);display:grid;place-items:center;
  text-align:center;color:var(--wood);font-weight:900;font-size:1.6cqw;background:rgba(255,248,231,.7)}
.ground{position:absolute;bottom:.5cqw;width:20cqw;height:3cqw;border-radius:50%;background:rgba(80,60,20,.18);filter:blur(.4cqw)}
.namecard{position:absolute;left:16cqw;top:35.5cqw;background:var(--cream);border:.3cqw solid var(--cream-line);border-radius:2cqw;
  padding:1cqw 1.8cqw;box-shadow:0 .5cqw 0 var(--cream-line);width:40cqw}
.namecard h1{margin:0;font-size:3cqw;font-weight:900;line-height:1.1}
.namecard .sci{font-style:italic;font-size:1.25cqw;color:var(--ink-2);margin-top:.3cqw}
.namecard .fam{font-size:1.15cqw;color:var(--ink-2)}
.tags{display:flex;gap:.6cqw;flex-wrap:wrap;margin-top:.7cqw}
.tag{font-size:1.05cqw;font-weight:700;padding:.25cqw .9cqw;border-radius:99px;background:#e5f2d5;color:var(--grass-dd)}
.tag.v{background:#fde6c4;color:#9a5a12}
.tag.t{background:#e8e1f7;color:#5b4796}
.otag{font:inherit;font-size:1.15cqw;font-weight:700;vertical-align:middle;margin-left:.8cqw;padding:.2cqw .9cqw;border-radius:99px;border:.2cqw solid currentColor;background:#e2f1fb;color:#2c6a94;cursor:pointer}
.otag.alien{background:#fde6c4;color:#9a5a12}
.onote{font-size:1.2cqw;margin-top:.5cqw;padding:.5cqw .9cqw;border-radius:1cqw;background:var(--cream-2)}
/* panel */
.panel{position:absolute;right:1.8cqw;top:2cqw;bottom:7.2cqw;width:39cqw;border-radius:2.6cqw;
  background:var(--cream);border:.35cqw solid var(--cream-line);box-shadow:0 .7cqw 0 #e3cf9f,0 1.5cqw 3cqw rgba(0,0,0,.18);
  display:flex;flex-direction:column;padding:1.4cqw}
.tabs{display:flex;gap:.6cqw;background:var(--cream-2);padding:.5cqw;border-radius:99px}
.tabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:900;font-size:1.45cqw;color:var(--ink-2);
  padding:.75cqw 0;border-radius:99px;cursor:pointer}
.tabs button.on{background:linear-gradient(#8bc34a,#5f9e34);color:#fff;box-shadow:0 .35cqw 0 var(--grass-dd)}
.note{margin:1cqw 0 .6cqw;font-size:1.05cqw;color:#8a5a12;background:#fff1d0;border-radius:1cqw;padding:.55cqw 1cqw}
.rows{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.55cqw;padding-right:.3cqw}
.row{display:grid;grid-template-columns:3cqw 1fr;gap:1cqw;align-items:center;background:#fffdf6;border:.2cqw solid var(--cream-line);
  border-radius:1.4cqw;padding:.6cqw 1cqw;box-shadow:0 .3cqw 0 var(--cream-line)}
.ic{width:3cqw;height:3cqw;border-radius:1cqw;display:grid;place-items:center;font-size:1.7cqw;background:var(--cream-2)}
.lbl{display:flex;align-items:center;gap:.6cqw;font-size:1.1cqw;font-weight:700;color:var(--ink-2)}
.val{font-size:1.35cqw;font-weight:900;line-height:1.35;margin-top:.15cqw}
.val.sm{font-size:1.2cqw;font-weight:700}
.src{font-size:.95cqw;color:var(--ink-2);margin-top:.2cqw}
.badge{font-size:.9cqw;font-weight:900;padding:.1cqw .7cqw;border-radius:99px}
.b-s{background:#e1efd0;color:var(--grass-dd)}     /* 物種資料 */
.b-g{background:#e4ecfb;color:#3c5e9e}             /* 遊戲估算 */
.st{font-size:.9cqw;font-weight:700;color:var(--ink-2)}
.pend{color:#b0874f}
.foot{text-align:center;font-size:.95cqw;color:var(--ink-2);margin-top:.6cqw}
/* bottom bar */
.bar{position:absolute;left:16cqw;right:43cqw;bottom:2cqw;height:4.4cqw;border-radius:99px;background:var(--cream);
  border:.3cqw solid var(--cream-line);box-shadow:0 .4cqw 0 #e3cf9f;display:flex;align-items:center;gap:1.2cqw;padding:0 1.8cqw;font-weight:900;font-size:1.3cqw}
.bar .dot{width:1cqw;height:1cqw;border-radius:50%;background:var(--grass)}
.bar .sep{width:.2cqw;height:2.2cqw;background:var(--cream-line)}
.go svg{width:4.4cqw;filter:drop-shadow(0 .25cqw .1cqw rgba(30,60,10,.35))}
.go{display:flex;align-items:center;justify-content:center;gap:1.4cqw;
  position:absolute;right:1.8cqw;bottom:1.6cqw;width:39cqw;height:4.8cqw;border:0;border-radius:99px;cursor:pointer;
  background:linear-gradient(#8bc34a,#4f8a2b);color:#fff;font:inherit;font-weight:900;font-size:2cqw;letter-spacing:.3cqw;
  box-shadow:0 .55cqw 0 var(--grass-dd),0 1cqw 2cqw rgba(0,0,0,.2)}
.go:active{transform:translateY(.3cqw);box-shadow:0 .25cqw 0 var(--grass-dd)}
[hidden]{display:none!important}
.modes{position:absolute;z-index:6;left:24cqw;top:10.6cqw;display:flex;gap:.4cqw;background:rgba(255,248,231,.85);padding:.35cqw;border-radius:99px;
  border:.2cqw solid var(--cream-line)}
.modes a{font-weight:900;font-size:1.2cqw;color:var(--ink-2);text-decoration:none;padding:.3cqw 1.4cqw;border-radius:99px}
.modes a.on{background:linear-gradient(#8bc34a,#5f9e34);color:#fff}
@media (max-width:640px){ body{padding:8px} }

/* ===== v0.14 2D 介面：GPT 畫的零件 ===== */
:root{--line:#5b3a1e}
.scene{object-fit:cover}
.sign{left:23cqw;top:-.8cqw;width:19cqw;height:auto}
.sign img{display:block;width:100%;filter:drop-shadow(0 .5cqw .4cqw rgba(60,30,0,.25))}
.sign b{position:absolute;left:0;right:0;top:56%;transform:translateY(-50%);text-align:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:2.8cqw;letter-spacing:.2cqw;color:#fff7e0;line-height:1;
  text-shadow:.16cqw 0 0 var(--line),-.16cqw 0 0 var(--line),0 .16cqw 0 var(--line),0 -.16cqw 0 var(--line),.12cqw .12cqw 0 var(--line),-.12cqw .12cqw 0 var(--line),.12cqw -.12cqw 0 var(--line),-.12cqw -.12cqw 0 var(--line),0 .4cqw 0 var(--line)}
.rail{background:rgba(255,248,231,.55);border:.3cqw solid var(--line);backdrop-filter:blur(2px)}
.av{width:8.4cqw;height:8.4cqw;border:0;border-radius:50%;background:url(art/ui/frame.png) center/contain no-repeat;box-shadow:none;overflow:visible}
.av.on{border:0;background-image:url(art/ui/frame_on.png);box-shadow:none;transform:scale(1.06)}
.av img{width:66%;height:66%}
.av .ph{color:#b9ab8b}
.hero .art{background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.55),rgba(255,255,255,.15) 55%,transparent 68%)}
.namecard,.panel,.bar{border-color:var(--line);border-width:.3cqw}
.namecard{box-shadow:0 .5cqw 0 #c9a46a}
.panel{box-shadow:0 .7cqw 0 #c9a46a,0 1.5cqw 3cqw rgba(0,0,0,.18)}
.bar{box-shadow:0 .4cqw 0 #c9a46a}
.tabs{border:.2cqw solid var(--cream-line)}
.tabs button.on{border:.2cqw solid var(--line)}
.row{border-color:#e6cf9f}
.ic{background:transparent;width:3.2cqw;height:3.2cqw}
.ic img{width:100%;height:100%;object-fit:contain}
.modes{background:transparent;border:0;gap:.3cqw;padding:0;left:16.5cqw;top:11cqw}
.hero{top:15.5cqw;height:21cqw}.hero .art{width:21cqw;height:21cqw}
.modes a{background:url(art/ui/pill.png) center/100% 100% no-repeat;color:var(--wood-d);padding:.4cqw 1cqw;font-size:1.1cqw}
.modes a.on{background:url(art/ui/pill_on.png) center/100% 100% no-repeat;color:var(--wood-d);padding-right:1.6cqw}
.go{border:.3cqw solid #2f5a17}
.modes a{display:inline-flex;align-items:center;gap:.35cqw}
.modes a::before{content:"";width:1.6cqw;height:1.6cqw;background:center/contain no-repeat;margin-left:-.5cqw}
.modes a:nth-child(1)::before{background-image:url(art/ui/nav_dex.png)}
.modes a:nth-child(2)::before{background-image:url(art/ui/nav_explore.png)}
.modes a:nth-child(3)::before{background-image:url(art/ui/nav_postcard.png)}
.modes a:nth-child(4)::before{background-image:url(art/ui/nav_station.png)}
.modes a:nth-child(5)::before{background-image:url(art/ui/nav_friends.png)}
.modes a:nth-child(6)::before{background-image:url(art/ui/nav_me.png)}
.scene{transition:filter .3s}
.scene.soft{filter:blur(.35cqw) saturate(.75) brightness(1.08);transform:scale(1.04)}
/* 手機橫放時 Safari 會自動放大文字，造成狀態列、導覽列超出（2026-11-12 使用者回報） */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.bar{overflow:hidden;white-space:nowrap}
.bar>span{min-width:0;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.bar>.sep,.bar>.dot{flex-shrink:0}
.modes{white-space:nowrap;flex-wrap:nowrap}
/* 選取中的頭像框右上角腳印被名單上緣切掉（2026-11-12 使用者回報）：名單上下多留空間 */
.rail{padding-top:2.4cqw;padding-bottom:2cqw}
.av.on{transform:scale(1.04)}
/* 腳印在圓框外的右上角：按鈕本身是圓形會把背景切成圓的，所以按鈕改成方形（框的圖本身就是圓的） */
.av,.av.on{border-radius:0}
.av:focus-visible{outline:.3cqw solid var(--wood);outline-offset:.2cqw;border-radius:50%}
/* ===== 直式（iPhone）版面（v0.28.0，2026-11-13 使用者決定：iPhone 直式為主）=====
   做法：舞台寬度＝手機寬度 ÷ 0.39，只顯示左邊 39%（39cqw＝手機寬）。原本橫向版右側面板就是 39cqw 寬，
   所以面板裡用 cqw 寫的字級、間距在手機上大小差不多，不用每個字重寫；只要把各區塊重新排位置。
   已改成直式的頁面在 <main> 加 class="pt"；還沒改的頁面維持橫向。 */
body:has(.stage.pt){padding:0;overflow:hidden;align-items:stretch}
.stage.pt{--vw:min(100vw,440px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--tab:calc(6.4cqw + var(--sb));
  width:calc(var(--vw) / .39);flex:none;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none;
  clip-path:inset(0 61% 0 0);transform:translateX(30.5%)}
@media (min-width:600px){body:has(.stage.pt){padding:16px 0;align-items:center}.stage.pt{height:min(calc(100dvh - 32px),900px);clip-path:inset(0 61% 0 0 round 28px)}}
.stage.pt .scene{width:39cqw}
.stage.pt .sign{display:none}
/* 底部導覽列 */
.stage.pt .modes{left:0;width:39cqw;top:auto;bottom:0;height:var(--tab);padding:.5cqw .4cqw var(--sb);background:var(--cream);border-top:.25cqw solid var(--cream-line);
  display:grid;grid-template-columns:repeat(6,1fr);gap:.2cqw;z-index:15;border-radius:0}
.stage.pt .modes a,.stage.pt .modes a.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;background:none;padding:0;font-size:1.15cqw;border-radius:1.4cqw;color:var(--ink-2)}
.stage.pt .modes a.on{background:#e4f2d6;color:var(--grass-dd);font-weight:900}
.stage.pt .modes a::before{width:2.7cqw;height:2.7cqw;margin:0}
/* 抽屜整個一起捲動（v0.32.1：手機畫面比較矮時，只捲中間資料區會被擠到幾乎 0 高度、滑不動）；分頁固定在抽屜上方 */
.stage.pt .panel{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.stage.pt .panel .rows{flex:none;overflow:visible}
.stage.pt .panel .tabs{position:sticky;top:-1.3cqw;z-index:3;flex:none}
/* 小花：右上角 */
.stage.pt .flowerhud{right:calc(61% + 1.2cqw)!important;top:calc(var(--st) + 1cqw)!important;font-size:1.4cqw!important;z-index:12!important}

/* 原型加速（v0.48.1）：國外信每一步至少停 10 秒，三步都看得到；國內信照整封至少 60 秒的速度 */
function tripRate(o){if(!o.intl||!o.l3)return o.k||2;
  const b1=o.leg1,b2=o.h-o.l3,H=[b1,b2-b1,o.l3],i=o.el<b1?0:o.el<b2?1:2;
  return H[i]/Math.max(10,H[i]*10);}
function startTrip(o){const c=C(o.to);if(!c)return;
  const iv=setInterval(()=>{o.el+=tripRate(o);
      if(o.el>=o.h){clearInterval(iv);st.out=st.out.filter(x=>x!==o);
        const evT=evArrive(o);   /* 送信插曲（v0.62.0）：發小花、補一句 */
        if(!o.nd&&c.kind!=="drift"&&ARR_ON()){o.nd=1;epNotify((c.kind==="friend"?`${NAME[o.courier]||"郵差"}把信送到${c.name}手上了，${c.name}回信了！`:`信送到${c.where}了，${c.name}回信了！`)+(evT?"\n"+evT:""),{icon:evT?"🧳":"✉️",go:"postcard_mockup.html",level:evT?"card":"toast"});}
        else if(evT&&c.kind==="drift")epNotify(evT,{icon:"🧳",level:"card"});
        if(c.kind==="drift"){
          const free=CANDIDATES.filter(x=>!CONTACTS.some(y=>y.id===x.id)&&!st.inbox.some(m=>m.from===x.id));
          const fit=free.filter(x=>o.cond.mode==="interest"?x.interest===o.cond.interest:o.cond.mode==="region"?x.where===o.cond.region:true);
          const pool=fit.length?fit:free;
          deliverMatch(o,pool);stationGift();
        }else if(c.kind==="friend"){st.inbox.push({fl:replyFlowers(),at:Date.now(),from:c.id,name:c.name,text:c.reply,tr:c.tr,front:FRIEND_FRONTS[Math.floor(Math.random()*FRIEND_FRONTS.length)]});}else{const r=replyVia(c.where,o);st.inbox.push({fl:replyFlowers(),at:Date.now(),from:c.id,name:c.name,text:c.reply,tr:c.tr,via:r.via,front:r.card?r.card.id:null});addReplyCard(r.card,c.where,c.name,c.reply);if(c.kind==="pen"&&addCountryStamp(c.where))epNotify(`新的國家郵戳：${c.where}！你的明信片第一次寄到${c.where}（小花 +${EARN.stamp}）`,{icon:"📮",level:"card"});stationGift();}}
      render();},1000);
}
/* 收件匣保存（v0.23.1）：收到的信、送信中的明信片、封鎖名單、留下來的筆友存在 ep-box；關掉再開會接著算 */
const BOX_KEY="ep-box";let RM_FR=[];
const ARR_ON=()=>{try{return JSON.parse(localStorage.getItem("ep-settings")||"{}").nArrive!==false}catch(e){return true}};   /* 設定 → 通知 → 信件送達 */
const boxSeen=()=>{try{return +localStorage.getItem("ep-box-seen")||0}catch(e){return 0}};
const markSeen=n=>{try{localStorage.setItem("ep-box-seen",String(n))}catch(e){}};
/* 好友邀請（v0.34.0）：筆友是假資料，邀請送出幾秒後對方「同意」，筆友轉到「好友」名單（寄信規則仍照筆友＝國外）。 */
function acceptFriend(id){const c=CONTACTS.find(x=>x.id===id);if(!c||c.isFriend)return;if(friendFull()){delete c.friendAsk;st.inbox.filter(m=>m.from===id).forEach(m=>{delete m.friendAsk});epNotify(`${c.name}想成為好友，但你的好友已滿（${friendCount()}／${friendMax()}）。刪除一位好友或升級後再邀請一次。`,{icon:"🤝",level:"card"});render();return;}c.isFriend=true;
  epNotify(`${c.name}同意了你的好友邀請！現在 ${c.name} 在「好友」名單裡，你也看得到對方填的城市與頭貼。`,{icon:"🤝",level:"card"});render();}
function saveBox(){try{localStorage.setItem(BOX_KEY,JSON.stringify({inbox:st.inbox,blocked:st.blocked,out:st.out.map(o=>({...o,savedAt:Date.now()})),kept:CONTACTS.filter(c=>c.kept),friends:CONTACTS.filter(c=>c.isFriend).map(c=>c.id),rmFr:RM_FR}));}catch(e){}}
function loadBox(){let b;try{b=JSON.parse(localStorage.getItem(BOX_KEY)||"null");}catch(e){}if(!b)return;
  (b.kept||[]).forEach(k=>{if(!CONTACTS.some(c=>c.id===k.id))CONTACTS.splice(CONTACTS.findIndex(x=>x.kind==="drift"),0,k);});
  (b.rmFr||[]).forEach(id=>{const i=CONTACTS.findIndex(x=>x.id===id);if(i>=0)CONTACTS.splice(i,1);RM_FR.push(id);});
  (b.friends||[]).forEach(id=>{const c=CONTACTS.find(x=>x.id===id);if(c)c.isFriend=true;});
  st.inbox=(b.inbox||[]).filter(m=>!!m.from);st.blocked=b.blocked||[];   /* v0.61.0：收件匣只放信，舊的通知不再顯示 */
  st.inbox.filter(m=>m.friendAsk&&m.from).forEach(m=>{const c=CONTACTS.find(x=>x.id===m.from);if(c&&!c.isFriend)setTimeout(()=>acceptFriend(m.from),3000);});   // 重新整理時還在等的邀請，繼續等
  (b.out||[]).forEach(o=>{o.el=(o.el||0)+Math.max(0,(Date.now()-(o.savedAt||Date.now()))/1000*(o.k||2));delete o.savedAt;st.out.push(o);startTrip(o);});}
function addDel(R,j,m){const arm=m.from&&st.delArm===j,b=`<button class="xdel${arm?" arm":""}" data-del="${j}" aria-label="${arm?"確定刪除這封信":"刪除"}">${arm?"確定刪除？":"✕"}</button>`;return R.replace(/^(\s*<div class="row[^>]*>)/,"$1"+b);}
function applyView(){const S=document.getElementById("stage");if(S)S.classList.toggle("fv",st.view==="friends");const a=document.getElementById("nPost"),b=document.getElementById("nFri");if(a)a.classList.toggle("on",st.view!=="friends");if(b)b.classList.toggle("on",st.view==="friends");}
function render(){
  /* 畫面更新時記住捲動位置再還原（v0.53.0）：有信在路上時每秒更新一次，收件人下拉清單與抽屜會被拉回最上面（「跳走」） */
  const SC=[".panel",".rcptlist","#rows","#contacts"].map(q=>{const e=document.querySelector(q);return e&&e.scrollTop?[q,e.scrollTop]:null}).filter(Boolean);
  if(busyC(st.courier)){const fr=MATES.find(k=>!busyC(k));if(fr)st.courier=fr;}   /* 選到送信中的郵差時，自動換成第一隻待命的（v0.58.2） */
  BUSY_SIG=busySig();try{fpRefresh()}catch(e){}try{cpRefresh()}catch(e){}applyView();CONTACTS.find(c=>c.kind==="drift").where=condText();renderContacts();renderCard();renderPanel();saveBox();try{updateAchDot()}catch(e){}
  SC.forEach(([q,t])=>{const e=document.querySelector(q);if(e)e.scrollTop=t;});
}

/* 收到的信：背面右上角貼郵票、蓋郵戳（寄出地＋日期）（2026-11-11 使用者：收信應該要有郵戳） */
function postmarkHTML(f,where,at){const d=new Date(at||Date.now()),ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  return `<div class="pmwrap"><div class="stampbox"><div class="mini">${art(f)}</div>郵票</div><div class="pmark" aria-label="郵戳：${esc(where)} ${ds}"><span><b>${esc(where)}</b>${ds}</span></div></div>`;}
let RD=null;
function openLetter(idx){
  const m=st.inbox[idx];if(!m||!m.from)return;const c2=C(m.from),f=m.front||"heron";RD={m,flip:false};
  if(!m.read){m.read=true;render();}   // 打開過＝已讀（v0.24.7）
  document.getElementById("rfront").innerHTML=frontHTML(f);
  document.getElementById("rback").innerHTML=`<div class="msg"><div class="txt">${esc(m.text)}</div>${m.tr?`<div class="trn">自動翻譯：${esc(m.tr)}</div>`:""}${m.via&&m.via.speed?`<div class="trn" style="${m.tr?"border-top:0;margin-top:0;padding-top:0":""}">🚚 駐站好感 ${m.via.aff}，最後一段快 ${Math.round(m.via.speed*100)}%</div>`:""}</div>
    <div class="to">${postmarkHTML(f,c2.where,m.at)}<div class="ln"><small>寄件人</small>${esc(c2.name)}</div><div class="ln"><small>${c2.kind==="friend"?"城市":"國家／地區"}</small>${esc(c2.where)}</div>
    <div class="ln"><small>收件人</small>${esc(ME)}</div>${m.via?`<div class="ln" style="font-size:.95cqw"><small>送信</small>${esc(m.via.out)} → ${esc(m.via.hub)}郵站的${esc(m.via.station)}</div>`:""}</div>`;
  const rd=document.getElementById("reader");rd.classList.remove("flip");rd.hidden=false;document.getElementById("readbtns").hidden=false;
  {const S=document.querySelector(".stage");if(S.classList.contains("sheetup"))document.getElementById("sheetbtn").click();}   /* 打開信時收起抽屜 */
  document.querySelector(".stage").classList.add("reading");document.getElementById("rflip").textContent="翻面看信";document.getElementById("rflip").focus();
}
function closeLetter(){RD=null;document.getElementById("reader").hidden=true;document.getElementById("readbtns").hidden=true;document.querySelector(".stage").classList.remove("reading");}
document.addEventListener("click",e=>{
  if(e.target.closest("#rclose")){closeLetter();return;}
  if(e.target.closest("#rflip")){RD.flip=!RD.flip;document.getElementById("reader").classList.toggle("flip",RD.flip);document.getElementById("rflip").textContent=RD.flip?"看正面":"翻面看信";return;}
  const op=e.target.closest("[data-open]");if(op){openLetter(+op.dataset.open);return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&RD)closeLetter();});
document.addEventListener("click",e=>{
  const t=e.target.closest("#rcpt,[data-endpen],[data-writeto],[data-mailfrom],[data-mailall],[data-delfriend],[data-del],[data-clearnotes],[data-to],[data-front],[data-courier],[data-tab],#flip,#go,[data-report],[data-block],[data-keep],[data-drop],[data-askfriend],[data-mmode],[data-mint],[data-mreg],[data-godrift],[data-penon],[data-restkit],[data-evuse],[data-boxv],[data-oout]");if(!t)return;
  if(t.dataset.evuse){const k=t.dataset.evuse==="cloak"?"evCloak":"evLamp";st[k]=!st[k];render();return;}
  if(t.dataset.restkit){const r=useRestkit(st.courier,STA);if(r){saveSta();restMsg=`${NAME[st.courier]}休息了一下，體力 +${RESTKIT.sta}%${r.first?"，好感 +1":"（今天已經加過好感）"}`;}render();return;}
  if(t.id==="rcpt"){st.rcptOpen=!st.rcptOpen;render();return;}
  if(t.dataset.endpen){const id=t.dataset.endpen;if(st.frArm!==id){st.frArm=id;render();return;}
    const c=CONTACTS.find(x=>x.id===id);st.frArm=null;
    if(c){CONTACTS.splice(CONTACTS.indexOf(c),1);RM_FR.push(id);if(st.to===id)st.to="f1";
      epNotify(`已結束與「${c.name}」的通信。筆友名額 ${penCount()}／${PEN_MAX}，可以再配對新的筆友了。`,{icon:"✉️",hist:false});}
    render();return;}
  if(t.dataset.mailfrom){st.from=t.dataset.mailfrom;st.tab="inbox";st.view="";st.rcptOpen=false;render();return;}   /* v0.66.0：好友頁「來信」→ 收件匣只顯示這位的來信 */
  if(t.dataset.mailall){st.from="";render();return;}
  if(t.dataset.writeto){const c=C(t.dataset.writeto);if(!allowed(c))return;st.to=c.id;st.tab="write";st.view="";st.flip=true;st.rcptOpen=false;render();return;}
  if(t.dataset.delfriend){const id=t.dataset.delfriend;if(st.frArm!==id){st.frArm=id;render();return;}
    const c=CONTACTS.find(x=>x.id===id);st.frArm=null;
    if(c){if(c.kind==="friend"){CONTACTS.splice(CONTACTS.indexOf(c),1);RM_FR.push(id);}else{c.isFriend=false;delete c.friendAsk;st.inbox.filter(m=>m.from===id).forEach(m=>{delete m.friendAsk});}
      epNotify(`已刪除好友「${c.name}」。好友名額 ${friendCount()}／${friendMax()}。`,{icon:"🤝",hist:false});
      st.to=(CONTACTS.find(isFr)||CONTACTS[0]).id;}
    render();return;}
  if(t.dataset.del!==undefined){const j=+t.dataset.del,m=st.inbox[j];if(!m)return;
    if(m.from&&st.delArm!==j){st.delArm=j;render();return;}
    st.inbox.splice(j,1);st.delArm=null;render();return;}
  if(t.dataset.clearnotes){st.inbox=st.inbox.filter(m=>!!m.from);st.delArm=null;render();return;}
  if(t.dataset.oout!==undefined){const o=st.out[+t.dataset.oout];if(o){o.open=!o.open;saveBox();render();}return;}
  if(t.dataset.boxv){st.delArm=null;st.boxView=t.dataset.boxv;render();return;}
  if(t.dataset.penon){st.penOn=true;epNotify("已在設定開啟筆友功能，可以到「找筆友」寄配對明信片了。",{icon:"⚙️",hist:false});render();return;}
  if(t.dataset.mmode){mt.mode=t.dataset.mmode;render();return;}
  if(t.dataset.mint){mt.interest=t.dataset.mint;render();return;}
  if(t.dataset.mreg){mt.region=t.dataset.mreg;render();return;}
  if(t.dataset.godrift){st.to="drift";st.tab="write";st.flip=true;render();return;}
  if(t.dataset.keep){const c=CANDIDATES.find(x=>x.id===t.dataset.keep);if(!c||penCount()>=PEN_MAX)return;
    CONTACTS.splice(CONTACTS.findIndex(x=>x.kind==="drift"),0,{kept:true,id:c.id,kind:"pen",name:c.name,where:c.where,area:"near",interest:c.interest,uni:c.uni,lang:c.lang,reply:c.reply,tr:c.tr});
    st.inbox.filter(m=>m.from===c.id).forEach(m=>m.decided="keep");render();return;}
  if(t.dataset.drop){st.inbox.filter(m=>m.from===t.dataset.drop).forEach(m=>m.decided="drop");render();return;}
  if(t.dataset.to){st.to=t.dataset.to;st.rcptOpen=false;}
  else if(t.dataset.front){st.front=t.dataset.front;st.flip=false;saveLast();}
  else if(t.dataset.courier){if(busyC(t.dataset.courier))return;st.courier=t.dataset.courier;if(st.auto)st.front=st.courier;restMsg="";saveLast();}
  else if(t.dataset.tab){st.tab=t.dataset.tab;st.from="";if(st.tab==="match"&&!penLocked()&&penCount()<PEN_MAX)st.to="drift";}
  else if(t.id==="flip"){st.flip=!st.flip;}
  else if(t.dataset.report){epNotify("已送出檢舉（原型示意），我們會審查這封信。",{icon:"🚩",hist:false});st.tab="inbox";}
  else if(t.dataset.block){st.blocked.push(t.dataset.block);st.inbox=st.inbox.filter(m=>m.from!==t.dataset.block);if(st.to===t.dataset.block)st.to="f1";}
  else if(t.dataset.askfriend){if(friendFull())return;{const cc=CONTACTS.find(x=>x.id===t.dataset.askfriend);if(cc)cc.friendAsk=true;}st.inbox.filter(m=>m.from===t.dataset.askfriend).forEach(m=>m.friendAsk=true);epNotify("已送出好友邀請，等對方回覆。雙方都同意後，才會看到對方自己填的城市與頭貼。（原型：幾秒後對方會同意）",{icon:"🤝",hist:false});setTimeout(()=>acceptFriend(t.dataset.askfriend),4000);}
  else if(t.id==="go"){
    if(busyC(st.courier))return;
    const c=C(st.to),tr=trip(),pf=postage(c);
    if(pf.fee>loadFlowers())return;
    /* 送信插曲（v0.62.0）：抽一次；延誤／順風只影響郵差負責的那段時間 */
    const evr=evRoll(st.courier,NAME[st.courier],tr.intl?tr.leg1:tr.h,{cloak:st.evCloak,lamp:st.evLamp}),evx=evr&&evr.ev;
    if(evx&&evx.speed!==1){const base=tr.intl?tr.leg1:tr.h,add=base*(evx.speed-1);tr.h+=add;if(tr.intl)tr.leg1+=add;}
    const TH=tr.h+(tr.intl?lastLeg().h:0),TK=TH/Math.max(60,TH*10);   /* 原型加速（v0.45.1）：每封信至少 60 秒，長路線每 1 小時 = 10 秒；TK＝每秒走幾小時 */
    STA[st.courier]=tr.after;STA_T[st.courier]=Date.now()+(tr.intl?Math.max(10,tr.leg1*10):tr.h/TK)*1000;saveSta();   // 送信途中不回復
    if(pf.fee){const n=loadFlowers()-pf.fee;try{localStorage.setItem(FLOWER_KEY,JSON.stringify(n))}catch(e){}updateFlowerHud(n);}
    {const ps=postState();if(!pf.reply)ps.sent++;if(!pf.fee)ps.free++;try{localStorage.setItem(POST_KEY,JSON.stringify(ps))}catch(e){}}
    st.inbox.filter(m=>m.from===c.id).forEach(m=>m.replied=true);
    const o={to:c.id,tn:c.name,cn:NAME[st.courier],courier:st.courier,h:tr.h+(tr.intl?lastLeg().h:0),el:0,cond:{...mt},intl:tr.intl,hub:tr.hub,leg1:tr.leg1,hubKm:tr.hubKm,ikm:tr.ikm,est:tr.est,l3:tr.intl?lastLeg().h:0,fee:pf.fee,feeWhy:pf.why};if(evx)o.ev=evx;o.k=TK;st.out.push(o);window.EPSFX&&EPSFX.play("send");st.text="";st.flip=false;st.tab="inbox";
    startTrip(o);
  }
  render();
});
document.addEventListener("input",e=>{
  if(e.target.id==="txt"){st.text=e.target.value;const n=[...st.text].length,bad=issues();const el=document.getElementById("cnt");el.textContent=`${n}／${maxLen()}`;el.classList.toggle("bad",!!bad.length);renderPanel();}
});
document.getElementById("age").addEventListener("change",e=>{
  st.age=e.target.value;st.minor=["teen","child","childnofam"].includes(st.age);
  st.penOn=st.age==="adult";
  if(st.age==="adult18")epNotify("生日快樂！你已經滿 18 歲，現在可以開啟筆友功能，和其他國家的玩家通信。筆友不會自動開啟，想用的話可以現在開啟。",{icon:"🎂",level:"card",action:{label:"開啟筆友功能",fn:()=>{st.penOn=true;epNotify("已開啟筆友功能，可以到「找筆友」寄配對明信片了。",{icon:"⚙️",hist:false});render();}}});
  if(penLocked()&&!isFr(C(st.to)))st.to="f1";render();});
loadBox();
/* 底部導覽「好友」「明信片」在本頁內切換檢視（?view=friends 從別的頁面過來） */
if(new URLSearchParams(location.search).get("view")==="friends")st.view="friends";
document.addEventListener("click",e=>{const n=e.target.closest("#nFri,#nPost");if(!n)return;e.preventDefault();e.stopPropagation();st.view=n.id==="nFri"?"friends":"";st.rcptOpen=false;render();},true);
document.addEventListener("click",e=>{if(st.rcptOpen&&e.target.isConnected&&!e.target.closest("#contacts")){st.rcptOpen=false;render();}});
render();
/* v0.32.2 使用者回報：明信片縮太小。抽屜已經可以整個捲動、也有「拉開」，所以明信片固定手機寬（--pcs .882），不再跟著畫面高度縮小 */
document.getElementById("sheetbtn").addEventListener("click",()=>{const S=document.querySelector(".stage"),up=S.classList.toggle("sheetup"),b=document.getElementById("sheetbtn");b.textContent=up?"▼ 收起，看明信片":"▲ 拉開";b.setAttribute("aria-expanded",up);});
/* 畫面太矮、資料區幾乎看不到時，點分頁就自動拉開 */
document.getElementById("tabs").addEventListener("click",()=>{const S=document.querySelector(".stage");if(S.classList.contains("pt")&&!S.classList.contains("sheetup")&&document.querySelector(".panel").clientHeight<260)document.getElementById("sheetbtn").click();});
/* 翻面寫信、讀信時自動收起，才看得到明信片 */
["flip","rflip"].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener("click",()=>{const S=document.querySelector(".stage");if(S.classList.contains("sheetup"))document.getElementById("sheetbtn").click();});});
</script>
